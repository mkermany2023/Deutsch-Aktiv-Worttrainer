name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android API 37 installieren
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Gradle 9.6 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: APK bauen
        run: gradle --no-daemon :app:assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-Aktiv-APK
          path: app/build/outputs/apk/debug/app-debug.apk
